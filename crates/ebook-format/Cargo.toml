[package]
name = "ebook-format"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ebook-ir.workspace = true
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
roxmltree = { version = "0.20", default-features = false }

# 本 crate 的 src 由并行分支持有，硬化任务不改它的行为。下面几条是纯风格
# warning（同一 if 分支、多余闭包、先 Default 再赋值、map_or(false, ..)），
# 先按包抑制以免整个 workspace 的 clippy 闸门被挡住；等格式层改动合入后
# 修代码并把这一段删掉。新增代码不要依赖这些 allow。
[lints.clippy]
field_reassign_with_default = "allow"
if_same_then_else = "allow"
redundant_closure = "allow"
unnecessary_map_or = "allow"
