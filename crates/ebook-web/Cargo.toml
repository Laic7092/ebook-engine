[package]
name = "ebook-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
epub = []
# 显式开启内置英文断字词典；默认不把 en.pat 打进 wasm。
hyphen-en = ["ebook-font/hyphen-en"]

[dependencies]
ebook-ir.workspace = true
ebook-layout.workspace = true
ebook-format.workspace = true
ebook-font.workspace = true
serde.workspace = true
postcard.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
