[workspace]
resolver = "2"
members = [
  "crates/ebook-ir",
  "crates/ebook-layout",
  "crates/ebook-cache",
  "crates/ebook-format",
  "crates/ebook-render",
  "crates/ebook-cli",
  "crates/ebook-web",
  "crates/ebook-font",
  "crates/ebook-raster",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
ebook-ir = { path = "crates/ebook-ir" }
ebook-layout = { path = "crates/ebook-layout", default-features = false }
ebook-cache = { path = "crates/ebook-cache" }
ebook-format = { path = "crates/ebook-format" }
ebook-render = { path = "crates/ebook-render" }
ebook-font = { path = "crates/ebook-font", default-features = false }
ebook-raster = { path = "crates/ebook-raster" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
harfrust = { version = "0.16", default-features = false, features = ["std"] }
read-fonts = { version = "0.47", default-features = false, features = ["std"] }
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
