[workspace]
resolver = "2"
members = [
  "crates/ebook-ir",
  "crates/ebook-layout",
  "crates/ebook-cache",
  "crates/ebook-format",
  "crates/ebook-render",
  "crates/ebook-cli",
  "crates/ebook-web",
  "crates/ebook-reader",
  "crates/ebook-abi",
  "crates/ebook-font",
  "crates/ebook-raster",
  "xtask",
]

[workspace.package]
version = "0.2.6"
edition = "2021"
publish = false

[workspace.dependencies]
ebook-ir = { path = "crates/ebook-ir" }
ebook-layout = { path = "crates/ebook-layout", default-features = false }
ebook-format = { path = "crates/ebook-format" }
ebook-render = { path = "crates/ebook-render" }
ebook-reader = { path = "crates/ebook-reader" }
ebook-font = { path = "crates/ebook-font", default-features = false }
ebook-raster = { path = "crates/ebook-raster" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
harfrust = { version = "0.16", default-features = false, features = ["std"] }
read-fonts = { version = "0.47", default-features = false, features = ["std"] }
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# native（iOS/Android/桌面）：跨 cgo 边界必须能 `catch_unwind`，
# 所以 `panic` 不能用 release 里的 `abort`；体积也不是这几 MB 的问题。
# 用法：cargo build --profile native --target aarch64-apple-ios
[profile.native]
inherits = "release"
opt-level = 3
panic = "unwind"
strip = "none"
# cgo/外部链接器不认 LLVM bitcode（`.llvmbc`），所以这里必须关掉 LTO。
lto = false
codegen-units = 16
