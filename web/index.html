<title>ebook · 书架</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f4ef;
  --bg-soft: #ece8df;
  --surface: #fffdf9;
  --surface-2: #f1ede5;
  --surface-3: #e7e1d6;
  --text: #201e1b;
  --text-soft: #4c4741;
  --muted: #837b71;
  --line: #e2dbcf;
  --accent: #b4532a;
  --accent-strong: #95421f;
  --accent-soft: #f8e9e0;
  --danger: #b42318;
  --reader-bg: #e8e3d9;
  --shadow: 0 18px 45px -24px rgba(49, 36, 22, 0.42);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --chrome-top-base: 54px;
  --chrome-bottom-base: 62px;
  --reader-chrome-top: calc(var(--chrome-top-base) + var(--safe-top));
  --reader-chrome-bottom: calc(var(--chrome-bottom-base) + var(--safe-bottom));
}
body.theme-sepia {
  color-scheme: light;
  --bg: #efe4cf;
  --bg-soft: #e8dac0;
  --surface: #fcf5e6;
  --surface-2: #f4ead7;
  --surface-3: #e9dcc4;
  --text: #3c3022;
  --text-soft: #5b4a36;
  --muted: #856f53;
  --line: #ddcbaa;
  --accent: #9a5728;
  --accent-strong: #7f441c;
  --accent-soft: #f1e0c7;
  --reader-bg: #e4d5bb;
  --shadow: 0 18px 45px -24px rgba(87, 62, 28, 0.45);
}
body.theme-dark {
  color-scheme: dark;
  --bg: #111211;
  --bg-soft: #0b0c0b;
  --surface: #1b1c1a;
  --surface-2: #252622;
  --surface-3: #30312c;
  --text: #ece8e0;
  --text-soft: #c6c0b6;
  --muted: #9e978c;
  --line: #33342f;
  --accent: #e9a06a;
  --accent-strong: #f0b58a;
  --accent-soft: #3a2a20;
  --danger: #ff8a7d;
  --reader-bg: #0d0e0d;
  --shadow: 0 18px 45px -24px rgba(0, 0, 0, 0.85);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.reading { overflow: hidden; overscroll-behavior: none; }
button, input, select { font: inherit; }
button {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  border-radius: 12px;
  padding: 9px 14px;
  cursor: pointer;
  touch-action: manipulation;
  transition: background 140ms ease, border-color 140ms ease, color 140ms ease, transform 90ms ease;
  -webkit-tap-highlight-color: transparent;
}
button:hover { background: var(--surface-2); border-color: var(--surface-3); }
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.38; cursor: default; transform: none; }
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 650;
}
button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
input[type="search"], input[type="text"], select {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  border-radius: 12px;
  padding: 10px 12px;
  outline: none;
}
input[type="search"]:focus, input[type="text"]:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
input[type="range"] { accent-color: var(--accent); }
.hidden, [hidden] { display: none !important; }
.icon { width: 20px; height: 20px; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn {
  width: 42px;
  height: 42px;
  padding: 0;
  display: inline-grid;
  place-items: center;
  flex: none;
  border-color: transparent;
  background: transparent;
}
.icon-btn:hover { background: var(--surface-2); border-color: transparent; }

/* ---- 书架 --------------------------------------------------------------- */
#library-view {
  min-height: 100dvh;
  padding-bottom: calc(40px + var(--safe-bottom));
  background:
    radial-gradient(circle at 12% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 34rem),
    var(--bg);
}
.library-top {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  backdrop-filter: blur(20px) saturate(1.15);
  -webkit-backdrop-filter: blur(20px) saturate(1.15);
}
.library-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand .mark {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  flex: none;
  color: #fff;
  background: linear-gradient(145deg, var(--accent), var(--accent-strong));
  box-shadow: 0 8px 20px -10px color-mix(in srgb, var(--accent) 70%, transparent);
}
.brand .mark .icon { width: 21px; height: 21px; }
.brand-text { min-width: 0; display: flex; align-items: baseline; gap: 9px; }
.brand h1 { margin: 0; font-size: 19px; line-height: 1.15; letter-spacing: -0.025em; white-space: nowrap; }
#library-count {
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#import { display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; height: 42px; white-space: nowrap; }
#import .icon { width: 17px; height: 17px; }
.search-box {
  position: relative;
  display: flex;
  align-items: center;
  margin-top: 11px;
}
.search-box .icon {
  position: absolute;
  left: 13px;
  width: 17px;
  height: 17px;
  color: var(--muted);
  pointer-events: none;
}
#search {
  width: 100%;
  height: 42px;
  padding: 0 14px 0 39px;
  border-color: transparent;
  background: var(--surface-2);
  font-size: 15px;
}
#search::placeholder { color: var(--muted); }
.library-main {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: 18px 16px 0;
}
#library-empty {
  max-width: 430px;
  margin: clamp(36px, 10vh, 110px) auto 0;
  padding: 34px 24px 30px;
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: var(--shadow);
}
.empty-art {
  width: 64px;
  height: 64px;
  margin: 0 auto 18px;
  display: grid;
  place-items: center;
  border-radius: 19px;
  background: var(--accent-soft);
  color: var(--accent);
}
.empty-art .icon { width: 30px; height: 30px; }
#library-empty h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.02em; }
#library-empty p { margin: 0 auto 22px; max-width: 300px; color: var(--muted); line-height: 1.65; font-size: 14px; }
#library-empty .empty-hint { display: block; margin-top: 15px; color: var(--muted); font-size: 11px; letter-spacing: 0.02em; }
#library-note {
  margin: 18vh auto 0;
  max-width: 320px;
  color: var(--muted);
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
}
#shelf {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px 14px;
  align-items: start;
}
.book-card {
  position: relative;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: 14px;
  background: transparent;
  cursor: pointer;
  outline: none;
  transition: transform 160ms ease;
}
.book-card:hover, .book-card:focus-visible { transform: translateY(-3px); }
.book-card:focus-visible .book-cover { outline: 2px solid var(--accent); outline-offset: 3px; }
.book-cover {
  position: relative;
  aspect-ratio: 2 / 3;
  width: 100%;
  border-radius: 9px 13px 13px 9px;
  box-shadow: 0 14px 26px -16px rgba(32, 25, 17, 0.62), 0 2px 5px rgba(32, 25, 17, 0.1);
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  padding: 15px 13px;
  isolation: isolate;
}
.book-cover::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 7px;
  z-index: 2;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.26), transparent);
}
.book-cover::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 30%, rgba(0, 0, 0, 0.4));
}
.book-format {
  position: absolute;
  top: 9px;
  right: 9px;
  z-index: 3;
  padding: 3px 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.88);
  color: #29251f;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.07em;
  backdrop-filter: blur(8px);
}
.book-cover-title {
  position: relative;
  z-index: 2;
  color: #fff;
  font-weight: 650;
  line-height: 1.3;
  font-size: clamp(13px, 3.8vw, 17px);
  letter-spacing: -0.01em;
  max-height: 4.1em;
  overflow: hidden;
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.38);
  word-break: break-word;
}
.book-info { min-width: 0; padding: 9px 2px 0; }
.book-info h3 {
  margin: 0 0 3px;
  font-size: 13px;
  line-height: 1.35;
  font-weight: 600;
  letter-spacing: -0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.book-info p { margin: 0; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.book-progress {
  height: 3px;
  margin-top: 8px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
}
.book-progress span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.book-delete {
  position: absolute;
  top: 7px;
  left: 7px;
  z-index: 4;
  width: 27px;
  height: 27px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  color: #fff;
  background: rgba(18, 16, 13, 0.55);
  font-size: 17px;
  line-height: 1;
  opacity: 0;
  backdrop-filter: blur(8px);
  transition: opacity 140ms ease, background 140ms ease;
}
.book-delete:hover { background: var(--danger); color: #fff; }
.book-card:hover .book-delete, .book-card:focus-within .book-delete { opacity: 1; }
@media (hover: none) {
  .book-delete { opacity: 1; }
}

/* ---- 阅读页 ------------------------------------------------------------- */
#reader-view {
  position: fixed;
  inset: 0;
  z-index: 5;
  height: 100dvh;
  display: block;
  background: var(--reader-bg);
  overflow: hidden;
}
.reader-chrome {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 12;
  display: flex;
  align-items: center;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(20px) saturate(1.1);
  -webkit-backdrop-filter: blur(20px) saturate(1.1);
  transition: opacity 150ms ease, transform 150ms ease;
}
#reader-top {
  top: 0;
  height: var(--reader-chrome-top);
  padding: var(--safe-top) 7px 0;
  gap: 3px;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
}
.reader-heading {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 1px;
  padding: 0 6px;
  line-height: 1.2;
  text-align: left;
}
#book-title {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13.5px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
#book-meta {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 10.5px;
}
#book-meta:empty { display: none; }
.reader-actions { display: flex; align-items: center; gap: 0; flex: none; }
#back { color: var(--accent); }
#reader-main {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: stretch;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--surface) 22%, transparent), transparent 38rem),
    var(--reader-bg);
}
#reader-stage {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 820px;
  display: flex;
  align-items: stretch;
  justify-content: center;
}
#page {
  display: block;
  background: #fff;
  border: 0;
  border-radius: 0;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#selection-layer {
  position: absolute;
  z-index: 1;
  display: block;
  background: transparent;
  pointer-events: none;
  border-radius: 0;
}
body.theme-sepia #page, body.theme-sepia #selection-layer { filter: sepia(0.18) saturate(0.94) brightness(1.01); }
body.theme-dark #page, body.theme-dark #selection-layer { filter: invert(0.9) hue-rotate(180deg) brightness(0.92) contrast(0.94); }
#reader-bottom {
  bottom: 0;
  min-height: var(--reader-chrome-bottom);
  padding: 0 8px var(--safe-bottom);
  gap: 4px;
  border-top: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
}
.nav-btn {
  width: 44px;
  height: 44px;
  padding: 0;
  display: grid;
  place-items: center;
  flex: none;
  border: 0;
  border-radius: 14px;
  background: var(--surface-2);
  color: var(--text-soft);
}
.nav-btn:hover { background: var(--surface-3); }
.reader-progress {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1px;
  padding: 0 7px;
}
#seek {
  width: 100%;
  height: 20px;
  margin: 0;
  cursor: pointer;
}
.reader-readout {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 10px;
  min-width: 0;
  margin-top: -2px;
  color: var(--muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#page-label { overflow: hidden; text-overflow: ellipsis; }
#progress { color: var(--text-soft); }
#status {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 12px);
  transform: translateX(-50%);
  max-width: min(520px, calc(100vw - 32px));
  padding: 8px 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  color: var(--text-soft);
  box-shadow: var(--shadow);
  font-size: 12px;
  line-height: 1.4;
  text-align: center;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  transition: opacity 160ms ease;
}
#status:not(:empty) { opacity: 1; }
#reader-hint {
  position: fixed;
  left: 50%;
  bottom: calc(24px + var(--safe-bottom));
  z-index: 14;
  transform: translateX(-50%);
  padding: 8px 14px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--text) 82%, transparent);
  color: var(--surface);
  font-size: 12px;
  line-height: 1.4;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: var(--shadow);
}

body.chrome-hidden #reader-top,
body.chrome-hidden #reader-bottom {
  opacity: 0;
  pointer-events: none;
}
body.chrome-hidden #reader-top { transform: translateY(-100%); }
body.chrome-hidden #reader-bottom { transform: translateY(100%); }

/* ---- 面板 --------------------------------------------------------------- */
#panel-backdrop {
  position: fixed;
  inset: 0;
  z-index: 18;
  background: rgba(20, 16, 12, 0.38);
  opacity: 0;
  visibility: hidden;
  transition: opacity 180ms ease, visibility 180ms ease;
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}
body.toc-open #panel-backdrop, body.settings-open #panel-backdrop, body.search-open #panel-backdrop {
  opacity: 1;
  visibility: visible;
}
#toc-panel, #settings-panel, #search-panel {
  position: fixed;
  z-index: 20;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: min(78dvh, 720px);
  padding: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -24px 60px -30px rgba(20, 15, 10, 0.6);
  transform: translateY(105%);
  /* 关闭时彻底隐藏：只靠 translate 移出屏幕，阴影仍会从视口底部漏出来。 */
  visibility: hidden;
  transition: transform 220ms cubic-bezier(0.22, 0.85, 0.32, 1), visibility 0s linear 220ms;
  overflow: hidden;
}
body.toc-open #toc-panel, body.settings-open #settings-panel, body.search-open #search-panel {
  transform: translateY(0);
  visibility: visible;
  transition: transform 220ms cubic-bezier(0.22, 0.85, 0.32, 1), visibility 0s;
}
#search-panel .panel-body { padding-top: 12px; }
.reader-search-box { margin-top: 0; }
#search-input {
  width: 100%;
  height: 44px;
  padding: 0 14px 0 39px;
  border-color: transparent;
  background: var(--surface-2);
  font-size: 15px;
}
.search-results { display: flex; flex-direction: column; gap: 3px; margin-top: 12px; }
.search-result {
  display: block;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text-soft);
  text-align: left;
  font-size: 13.5px;
  line-height: 1.55;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.search-result:hover, .search-result:focus-visible { background: var(--surface-2); }
.search-result strong { display: block; margin-bottom: 2px; color: var(--text); font-size: 12px; font-weight: 650; }
.search-result mark { padding: 0 1px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.search-empty { margin: 18px 2px 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
.search-empty.error { color: var(--danger); }
.panel-grab {
  flex: none;
  width: 36px;
  height: 4px;
  margin: 7px auto 3px;
  border-radius: 999px;
  background: var(--surface-3);
}
.panel-head {
  position: relative;
  z-index: 2;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0;
  padding: 6px 18px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.panel-body {
  flex: 1;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 14px 18px calc(24px + var(--safe-bottom));
}
.panel-head strong { display: block; font-size: 17px; letter-spacing: -0.02em; }
.panel-sub { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
.panel-head .icon-btn { margin-right: -9px; }
#toc ul { list-style: none; margin: 0; padding: 0 0 0 15px; }
#toc > ul { padding-left: 0; }
#toc li { margin: 1px 0; }
.toc-entry {
  display: block;
  width: 100%;
  padding: 10px 11px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text-soft);
  text-align: left;
  font-size: 13.5px;
  line-height: 1.45;
  /* 章节名可能是一长串没有空格的文字（URL、编号、英文单词），必须允许任意断行，
     否则目录面板会出现横向滚动条。 */
  overflow-wrap: anywhere;
  word-break: break-word;
}
.toc-entry:hover { background: var(--surface-2); }
.toc-entry.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.toc-entry:disabled { color: var(--muted); }
.setting { display: block; margin: 0 0 20px; }
.setting > .setting-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 9px;
  color: var(--text-soft);
  font-size: 13px;
  font-weight: 600;
}
.setting > .setting-label output, #font-size-label, #margin-label {
  color: var(--accent);
  font-size: 12px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.setting input[type="range"] { width: 100%; height: 24px; }
#theme, #text-align { width: 100%; height: 42px; background: var(--surface-2); border-color: transparent; }
.setting.opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
  margin-bottom: 8px;
  padding: 0 2px;
  color: var(--text-soft);
  font-size: 13.5px;
  font-weight: 550;
}
.setting.opt input { width: 18px; height: 18px; accent-color: var(--accent); }
.file-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--text-soft);
  font-size: 13px;
}
.file-row input { max-width: 58%; font-size: 11px; }
#settings-reset { width: 100%; height: 44px; margin-top: 6px; color: var(--danger); }
.hint { margin: 14px 2px 0; color: var(--muted); font-size: 11.5px; line-height: 1.7; }

/* ---- 全局 --------------------------------------------------------------- */
#banner {
  position: fixed;
  top: calc(12px + var(--safe-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  width: min(680px, calc(100vw - 24px));
  padding: 12px 15px;
  border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--line));
  background: color-mix(in srgb, var(--danger) 8%, var(--surface));
  color: var(--danger);
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.5;
  box-shadow: var(--shadow);
}
#drag-hint {
  position: fixed;
  inset: 12px;
  z-index: 70;
  display: grid;
  place-items: center;
  border: 2px dashed var(--accent);
  border-radius: 22px;
  background: color-mix(in srgb, var(--accent) 10%, var(--bg));
  color: var(--accent);
  font-size: 17px;
  font-weight: 650;
  pointer-events: none;
}

@media (min-width: 520px) {
  .library-main { padding: 22px 22px 0; }
  .library-top { padding-left: 22px; padding-right: 22px; }
  #shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 18px; }
  .book-cover-title { font-size: clamp(14px, 2.3vw, 18px); }
}
@media (min-width: 760px) {
  :root { --chrome-top-base: 58px; --chrome-bottom-base: 66px; }
  .library-top { padding-top: 16px; padding-bottom: 14px; }
  .library-main { padding: 28px 32px 0; }
  .library-top { padding-left: 32px; padding-right: 32px; }
  #shelf { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 24px; }
  .brand h1 { font-size: 22px; }
  #search { height: 44px; }
  #page { border-radius: 7px; box-shadow: 0 18px 48px -20px rgba(35, 28, 19, 0.5); }
  #reader-top { padding-left: 14px; padding-right: 14px; }
  #book-title { font-size: 14.5px; }
  #reader-bottom { padding-left: 16px; padding-right: 16px; }
  #toc-panel { top: 0; right: auto; bottom: 0; width: min(380px, 86vw); height: auto; max-height: none; border-radius: 0 22px 22px 0; border: 0; border-right: 1px solid var(--line); transform: translateX(-104%); }
  #settings-panel { top: 0; left: auto; bottom: 0; width: min(380px, 86vw); height: auto; max-height: none; border-radius: 22px 0 0 22px; border: 0; border-left: 1px solid var(--line); transform: translateX(104%); }
  #search-panel { top: 0; left: auto; bottom: 0; width: min(420px, 90vw); height: auto; max-height: none; border-radius: 22px 0 0 22px; border: 0; border-left: 1px solid var(--line); transform: translateX(104%); }
  body.toc-open #toc-panel, body.settings-open #settings-panel, body.search-open #search-panel { transform: translateX(0); }
  .panel-grab { display: none; }
  .panel-head { padding: 20px 18px 12px; }
  .panel-body { padding: 14px 18px 24px; }
}
@media (min-width: 1080px) {
  .library-main { padding-left: 48px; padding-right: 48px; }
  .library-top { padding-left: 48px; padding-right: 48px; }
  #shelf { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 34px 28px; }
}
@media (min-width: 1320px) {
  #shelf { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
@media (max-width: 380px) {
  #import span { display: none; }
  #import { width: 42px; padding: 0; justify-content: center; }
  .brand h1 { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body class="theme-light">
<div id="banner" hidden></div>
<div id="drag-hint" hidden>松开文件，加入书架</div>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 1 4 20.5Z"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></symbol>
  <symbol id="icon-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="icon-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="icon-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="icon-left" viewBox="0 0 24 24"><path d="m14 18-6-6 6-6"/></symbol>
  <symbol id="icon-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</svg>

<section id="library-view">
  <header class="library-top">
    <div class="library-bar">
      <div class="brand">
        <span class="mark"><svg class="icon"><use href="#icon-book"/></svg></span>
        <div class="brand-text">
          <h1>书架</h1>
          <span id="library-count"></span>
        </div>
      </div>
      <button id="import" class="primary" type="button">
        <svg class="icon"><use href="#icon-plus"/></svg><span>导入</span>
      </button>
    </div>
    <label class="search-box">
      <svg class="icon"><use href="#icon-search"/></svg>
      <input id="search" type="search" placeholder="搜索书名、作者" autocomplete="off" aria-label="搜索书籍">
    </label>
  </header>
  <main class="library-main">
    <div id="library-empty">
      <div class="empty-art"><svg class="icon"><use href="#icon-book"/></svg></div>
      <h2>从一本书开始</h2>
      <p>导入 EPUB 或 TXT，书籍与阅读进度都会保存在本机。也可以直接把文件拖进窗口。</p>
      <button id="import-empty" class="primary" type="button">选择文件</button>
      <span class="empty-hint">支持 EPUB · TXT · 本地存储</span>
    </div>
    <div id="library-note" hidden>没有找到匹配的书。</div>
    <div id="shelf"></div>
  </main>
</section>

<section id="reader-view" hidden>
  <header id="reader-top" class="reader-chrome">
    <button id="back" class="icon-btn" type="button" aria-label="返回书架" title="返回书架">
      <svg class="icon"><use href="#icon-back"/></svg>
    </button>
    <div class="reader-heading">
      <span id="book-title">未打开书籍</span>
      <span id="book-meta"></span>
    </div>
    <div class="reader-actions">
      <button id="search-toggle" class="icon-btn" type="button" aria-label="全文搜索" title="全文搜索 (F)">
        <svg class="icon"><use href="#icon-search"/></svg>
      </button>
      <button id="toc-toggle" class="icon-btn" type="button" aria-label="目录" title="目录 (T)">
        <svg class="icon"><use href="#icon-list"/></svg>
      </button>
      <button id="settings-toggle" class="icon-btn" type="button" aria-label="阅读设置" title="阅读设置">
        <svg class="icon"><use href="#icon-sliders"/></svg>
      </button>
    </div>
  </header>

  <main id="reader-main">
    <div id="reader-stage"><canvas id="page"></canvas><canvas id="selection-layer" aria-hidden="true"></canvas></div>
  </main>

  <footer id="reader-bottom" class="reader-chrome">
    <button id="prev" class="nav-btn" type="button" aria-label="上一页" title="上一页">
      <svg class="icon"><use href="#icon-left"/></svg>
    </button>
    <div class="reader-progress">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="阅读进度">
      <div class="reader-readout">
        <span id="page-label"></span>
        <span id="progress"></span>
      </div>
    </div>
    <button id="next" class="nav-btn" type="button" aria-label="下一页" title="下一页">
      <svg class="icon"><use href="#icon-right"/></svg>
    </button>
    <span id="status" role="status"></span>
  </footer>

  <div id="panel-backdrop"></div>
  <div id="reader-hint" hidden></div>

  <aside id="toc-panel">
    <div class="panel-grab"></div>
    <div class="panel-head">
      <div>
        <strong>目录</strong>
        <span class="panel-sub">跳转到章节</span>
      </div>
      <button id="toc-close" class="icon-btn" type="button" aria-label="关闭目录">
        <svg class="icon"><use href="#icon-close"/></svg>
      </button>
    </div>
    <div class="panel-body"><nav id="toc" aria-label="目录内容"></nav></div>
  </aside>

  <aside id="search-panel">
    <div class="panel-grab"></div>
    <div class="panel-head">
      <div>
        <strong>全文搜索</strong>
        <span class="panel-sub" id="search-summary">输入关键词，搜索整本书</span>
      </div>
      <button id="search-close" class="icon-btn" type="button" aria-label="关闭搜索">
        <svg class="icon"><use href="#icon-close"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <label class="search-box reader-search-box">
        <svg class="icon"><use href="#icon-search"/></svg>
        <input id="search-input" type="search" placeholder="搜索全文…" autocomplete="off" aria-label="全文搜索">
      </label>
      <div id="search-results" class="search-results" role="list"></div>
    </div>
  </aside>

  <aside id="settings-panel">
    <div class="panel-grab"></div>
    <div class="panel-head">
      <div>
        <strong>阅读设置</strong>
        <span class="panel-sub">即时生效，自动保存</span>
      </div>
      <button id="settings-close" class="icon-btn" type="button" aria-label="关闭设置">
        <svg class="icon"><use href="#icon-close"/></svg>
      </button>
    </div>
    <div class="panel-body">
    <label class="setting">
      <span class="setting-label">字号 <output id="font-size-label">18px</output></span>
      <input id="font-size" type="range" min="12" max="36" step="1" value="18">
    </label>
    <label class="setting opt"><span>粗体</span><input id="font-bold" type="checkbox"></label>
    <label class="setting">
      <span class="setting-label">行间距 <output id="line-height-label">1.5×</output></span>
      <input id="line-height" type="range" min="0.9" max="2.4" step="0.05" value="1.5">
    </label>
    <label class="setting">
      <span class="setting-label">字符间距 <output id="letter-spacing-label">0px</output></span>
      <input id="letter-spacing" type="range" min="-2" max="6" step="0.5" value="0">
    </label>
    <label class="setting">
      <span class="setting-label">页边距 <output id="margin-label">48px</output></span>
      <input id="margin" type="range" min="24" max="96" step="2" value="48">
    </label>
    <label class="setting">
      <span class="setting-label">对齐方式</span>
      <select id="text-align">
        <option value="book">原书</option>
        <option value="start">左对齐</option>
        <option value="center">居中</option>
        <option value="end">右对齐</option>
        <option value="justify">两端对齐</option>
      </select>
    </label>
    <label class="setting">
      <span class="setting-label">翻页动画</span>
      <select id="page-animation">
        <option value="slide">滑动（跟手）</option>
        <option value="fade">淡入淡出</option>
        <option value="none">无动画</option>
      </select>
    </label>
    <label class="setting">
      <span class="setting-label">主题</span>
      <select id="theme">
        <option value="light">明亮</option>
        <option value="sepia">护眼</option>
        <option value="dark">夜间</option>
      </select>
    </label>
    <label class="setting opt"><span>使用内置拉丁字体</span><input id="builtin-font" type="checkbox"></label>
    <label class="file-row"><span>加载本地字体</span><input id="font-file" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2,application/font-woff"></label>
    <button id="settings-reset" type="button">恢复默认设置</button>
    <p class="hint">移动端工具栏会自动隐藏：轻点左右两侧或横向滑动翻页，轻点中间显示/隐藏工具栏；方向键或空格翻页，F 或 / 打开全文搜索，Esc 关闭面板/隐藏工具栏/返回书架。TXT 会按「第 N 章 / Chapter N」标题行自动分章。</p>
    </div>
  </aside>
</section>

<input id="file" type="file" accept=".epub,.txt,.md,text/plain,application/epub+zip" hidden>
<script type="module" src="./app.js"></script>
</body>
</html>
