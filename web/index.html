<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebook demo</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; background: #e9edf1; color: #20242a; }
header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 18px; background: #ffffff; border-bottom: 1px solid #cbd4dd; }
header h1 { margin: 0 12px 0 0; font-size: 16px; font-weight: 600; }
header .book { font-weight: 600; }
header .meta { color: #65717f; font-size: 13px; }
header button, header select { font: inherit; padding: 6px 10px; border: 1px solid #aab6c2; background: #f7f9fb; border-radius: 6px; cursor: pointer; }
header button:hover { background: #eef3f7; }
main { display: flex; justify-content: center; padding: 24px 12px 40px; }
canvas { max-width: 100%; height: auto; background: #ffffff; box-shadow: 0 8px 30px rgba(20,30,45,0.16); touch-action: none; }
#progress { margin-left: 12px; color: #3f4c5a; font-variant-numeric: tabular-nums; }
footer { text-align: center; color: #5e6b78; font-size: 14px; padding-bottom: 28px; }
#status { color: #65717f; font-size: 13px; }
header .opt { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; color: #4b5866; }
#banner { margin: 16px auto 0; max-width: 820px; padding: 12px 16px; border: 1px solid #d9a2a2; background: #fdf2f2; color: #8a2b2b; border-radius: 8px; font-size: 14px; line-height: 1.5; }
#toc-toggle { font-size: 15px; line-height: 1; padding: 6px 9px; }
#toc-panel { position: fixed; top: 0; bottom: 0; left: 0; width: 290px; overflow: auto; background: #ffffff; border-right: 1px solid #cbd4dd; box-shadow: 6px 0 24px rgba(20,30,45,0.12); transform: translateX(-100%); transition: transform 120ms ease-out; z-index: 20; padding: 18px 14px 40px; }
body.toc-open #toc-panel { transform: none; }
#toc ul { list-style: none; margin: 0; padding-left: 14px; }
#toc > ul { padding-left: 0; }
.toc-entry { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px; line-height: 1.45; padding: 6px 8px; margin: 1px 0; border: 0; border-radius: 6px; background: transparent; color: #33404d; cursor: pointer; }
.toc-entry:hover { background: #eef3f7; }
.toc-entry.active { background: #e3edf6; color: #17384f; font-weight: 600; }
.toc-entry:disabled { color: #9aa5b1; cursor: default; }
@media (min-width: 1000px) { #toc-panel { transform: none; } body { padding-left: 290px; } }
</style>
</head>
<body>
<header>
  <button id="toc-toggle" type="button" aria-label="contents" aria-controls="toc-panel">&#9776;</button>
  <h1>ebook</h1>
  <span class="book" id="book-title">loading</span>
  <span class="meta" id="book-meta"></span>
  <select id="chapter" aria-label="chapter"></select>
  <button id="prev">Prev</button>
  <button id="next">Next</button>
  <input id="file" type="file" accept=".epub,application/epub+zip">
  <label class="opt"><input id="builtin-font" type="checkbox"> builtin font</label>
  <label class="opt"><input id="font-file" type="file" accept=".ttf,.otf"> load font</label>
  <label class="opt"><input id="fit" type="checkbox" checked> fit</label>
  <span id="status"></span>
</header>
<div id="banner" hidden></div>
<aside id="toc-panel"><nav id="toc" aria-label="contents"></nav></aside>
<main><canvas id="page"></canvas></main>
<footer><span id="page-label"></span><span id="progress"></span></footer>
<script type="module" src="./app.js"></script>
</body>
</html>
