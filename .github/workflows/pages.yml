name: Pages

# 构建 wasm + 静态包并发布到 GitHub Pages。
# 站点挂在 /<repo>/ 子路径下：web/ 里所有资源都是相对路径，
# 不要为了部署把 "./x" 改成 "/x"。
#
# 首次使用：仓库 Settings → Pages → Source 选 "GitHub Actions"。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Actions runner 在境外，直连比走镜像快也更稳。
  GH_PROXY: ""

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 与 CI 共用：工具链版本、wasm32 target 都从 rust-toolchain.toml 读。
      # 这里不装 fmt/clippy，缓存也与 CI 分开（release wasm vs debug）。
      - uses: ./.github/actions/rust
        with:
          cache-key: pages

      - id: versions
        run: |
          {
            echo "wasm_bindgen=$(scripts/versions.sh wasm-bindgen)"
            echo "esbuild=$(scripts/versions.sh esbuild)"
          } >> "$GITHUB_OUTPUT"

      # ebook-web 把 wasm-bindgen 精确锁在 Cargo.toml 里，CLI 必须同版本。
      - name: install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.versions.outputs.wasm_bindgen }}

      # 部署只需要 web/ 的资源：字体、图标、启动图。测试字体、Unicode 表、
      # 断字表和 EPUB 夹具与站点无关，--web-only 不碰它们（也就不需要 woff）。
      # 5 MB 的中文字体每次都下太慢，按内容固定 key 缓存。
      - name: cache web assets
        uses: actions/cache@v4
        with:
          path: |
            fixtures/font/test.ttf
            web/latin.ttf
            web/cjk.woff2
            web/icon-180.png
            web/icon-192.png
            web/icon-512.png
            web/splash
          key: ${{ runner.os }}-web-assets-v1

      - name: generate web assets
        run: scripts/generate.sh --web-only

      - name: build wasm (web/pkg)
        run: web/build.sh

      # esbuild 在 PATH 上就压缩，否则原样拷贝；两者都能部署。
      - name: install esbuild
        run: npm install --global esbuild@${{ steps.versions.outputs.esbuild }}

      - name: minify (web/dist)
        run: web/minify.sh

      # artifact 方式不走 Jekyll，这个文件只是防御。
      - name: touch .nojekyll
        run: touch web/dist/.nojekyll

      # 需要仓库已启用 Pages（Source = GitHub Actions），否则这一步会
      # 报 "Get Pages site failed"。启用入口：Settings → Pages → Source。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
