name: CI

on:
  # 只跟分支。tag 触碰同一个 commit，没必要再跑一遍：release 的 gate 是按
  # commit 找 check-run 的，分支那次就是它要等的那个。
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # runner 在境外，直连比走国内镜像快也更稳。gh-proxy 对数据中心 IP 回 403。
  GH_PROXY: ""

jobs:
  # 名字被 release.yml 的 gate 按 check-run 名字查找；改这里要同步改那边。
  check:
    name: fmt / clippy / test / xtask
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 工具链版本来自 rust-toolchain.toml（这个 action 里读），这里不再写死。
      - uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy

      - id: versions
        run: |
          {
            echo "wasm_bindgen=$(scripts/versions.sh wasm-bindgen)"
            echo "woff=$(scripts/versions.sh woff)"
          } >> "$GITHUB_OUTPUT"

      - name: install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ebook-web 把 wasm-bindgen 精确锁在 Cargo.toml 里，CLI 必须同版本。
      - name: install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.versions.outputs.wasm_bindgen }}

      # woff 只在 generate.sh 里转夹具字体，纯 Rust 编译约 1 分钟；按版本缓存二进制。
      - name: cache woff
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/woff
          key: ${{ runner.os }}-woff-${{ steps.versions.outputs.woff }}

      - name: install woff
        run: command -v woff >/dev/null || cargo install woff --version "${{ steps.versions.outputs.woff }}" --features binary --locked

      # 字体/EPUB 夹具不入库，测试前按需重建（跳过图标与 5 MB 中文字体）。
      - name: generate fixtures
        run: scripts/generate.sh --skip-web

      # 闸门只有这一份：本地 `scripts/check.sh` 与 CI 跑的是同一个脚本，
      # 不再出现“CI 里改了、脚本忘了改”的漂移。
      - name: scripts/check.sh
        run: scripts/check.sh
