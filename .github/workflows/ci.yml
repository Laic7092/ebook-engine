name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / xtask
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: install Rust (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ebook-web 把 wasm-bindgen 精确锁在 0.2.129，CLI 必须同版本。
      - name: install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      # clippy 与本地 scripts/check.sh 一致：warning 也阻断。
      # 少数属于其他并行分支路径的风格 warning 在源码/清单里用带理由的
      # allow 收口，不在 CI 上放宽。
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      # tests/golden/*.ir 与 tests/golden/pixels.txt 已入库，干净 checkout
      # 上直接逐字节比较；这里不跑 bless，否则回归会被覆盖成“通过”。
      - name: xtask all (golden / contract / app / pixel / size / parity)
        run: cargo run -p xtask -- all

      - name: xtask size
        run: cargo run -p xtask -- size
