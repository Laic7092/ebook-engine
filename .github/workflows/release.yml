name: Release

# A tag makes a release with one static library per target: the C ABI built
# for the hosts that link it (iOS, macOS, Linux, Android, Windows), so a
# consumer downloads a file instead of building Rust. Asset names are
#
#   libebook_abi-<target>.tar.gz   (libebook_abi.a / ebook_abi.lib + ebook_abi.h)
#   SHA256SUMS                     (all of them)
#
# targets: ios-arm64, ios-simulator-arm64, macos-arm64, macos-x64,
#          linux-x64, android-arm64, android-armv7, android-x64, windows-x64
#
# The header that goes with these is `crates/ebook-abi/include/ebook_abi.h`
# (checked against the Rust exports by `cargo test -p ebook-abi`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发版前先等这次提交的 CI 变绿：v0.2.1 / v0.2.2 都是 CI 红着发的版。
  # 手动 dispatch（没有 tag）时直接放过，只用于试跑产物。
  gate:
    name: CI must be green
    runs-on: ubuntu-latest
    steps:
      - name: wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/*) ;;
            *) echo "not a tag, skipping the gate"; exit 0 ;;
          esac
          check="fmt / clippy / test / xtask"
          for _ in $(seq 1 60); do
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq "[.check_runs[] | select(.name == \"${check}\")] | .[0].conclusion // \"\"")"
            case "$conclusion" in
              success) echo "CI: success"; exit 0 ;;
              "") echo "CI not started yet, checking again in 30s"; sleep 30 ;;
              *) echo "CI: ${conclusion}, refusing to ship" >&2; exit 1 ;;
            esac
          done
          echo "CI still not green after 30 minutes" >&2
          exit 1

  build:
    name: ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ios-arm64
            triple: aarch64-apple-ios
            os: macos-latest
          - target: ios-simulator-arm64
            triple: aarch64-apple-ios-sim
            os: macos-latest
          - target: macos-arm64
            triple: aarch64-apple-darwin
            os: macos-latest
          - target: macos-x64
            triple: x86_64-apple-darwin
            os: macos-latest
          - target: linux-x64
            triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Android 的 clang wrapper 名字与 triple 不同（armv7 是 armv7a），
          # 所以 linker 单独给，不靠字符串拼。
          - target: android-arm64
            triple: aarch64-linux-android
            os: ubuntu-latest
            linker: aarch64-linux-android21-clang
          - target: android-armv7
            triple: armv7-linux-androideabi
            os: ubuntu-latest
            linker: armv7a-linux-androideabi21-clang
          - target: android-x64
            triple: x86_64-linux-android
            os: ubuntu-latest
            linker: x86_64-linux-android21-clang
          # Windows 出的是 `ebook_abi.lib`（MSVC 的静态库）。
          - target: windows-x64
            triple: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The toolchain rust-toolchain.toml pins, with this target's std: a
      # floating `stable` isn't it, and a missing `core` is how that shows.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2

      # The `native` profile: panic = unwind (the ABI's catch_unwind needs it)
      # and no LTO (an external linker embeds it).
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.triple }}"
          if [ -n "${{ matrix.linker }}" ]; then
            ndk="${ANDROID_NDK_LATEST_HOME:?this runner has no Android NDK}"
            toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
            env_name="CARGO_TARGET_$(echo "${{ matrix.triple }}" | tr 'a-z-' 'A-Z_')_LINKER"
            export "$env_name=$toolchain/${{ matrix.linker }}"
            printf '%s -> %s\n' "$env_name" "${!env_name}"
          fi
          cargo build -p ebook-abi --profile native --target "${{ matrix.triple }}"

          out="target/${{ matrix.triple }}/native"
          # unix 上叫 libebook_abi.a，MSVC 上叫 ebook_abi.lib。
          lib=""
          for candidate in "$out/libebook_abi.a" "$out/ebook_abi.lib"; do
            if [ -f "$candidate" ]; then lib="$candidate"; break; fi
          done
          test -n "$lib" || { echo "no static library in $out" >&2; exit 1; }
          tar -czf "$out/libebook_abi-${{ matrix.target }}.tar.gz" \
            -C "$out" "$(basename "$lib")" \
            -C "$GITHUB_WORKSPACE/crates/ebook-abi/include" ebook_abi.h
          ls -la "$out/libebook_abi-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.target }}
          path: target/${{ matrix.triple }}/native/libebook_abi-${{ matrix.target }}.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          sha256sum libebook_abi-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            assets/libebook_abi-*.tar.gz assets/SHA256SUMS
