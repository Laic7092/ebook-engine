name: Release

# A tag makes a release with one static library per target: the C ABI built
# for the hosts that link it (iOS, macOS, Linux), so a consumer downloads a
# file instead of building Rust. Asset names are
#
#   libebook_abi-<target>.tar.gz   (one libebook_abi.a inside)
#   SHA256SUMS                     (all of them)
#
# targets: ios-arm64, ios-simulator-arm64, macos-arm64, macos-x64, linux-x64

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ios-arm64
            triple: aarch64-apple-ios
            os: macos-latest
          - target: ios-simulator-arm64
            triple: aarch64-apple-ios-sim
            os: macos-latest
          - target: macos-arm64
            triple: aarch64-apple-darwin
            os: macos-latest
          - target: macos-x64
            triple: x86_64-apple-darwin
            os: macos-latest
          - target: linux-x64
            triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2

      # The `native` profile: panic = unwind (the ABI's catch_unwind needs it)
      # and no LTO (an external linker embeds it).
      - name: Build
        run: |
          cargo build -p ebook-abi --profile native --target "${{ matrix.triple }}"
          cd "target/${{ matrix.triple }}/native"
          tar -czf "libebook_abi-${{ matrix.target }}.tar.gz" libebook_abi.a
          ls -la libebook_abi.a libebook_abi-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.target }}
          path: target/${{ matrix.triple }}/native/libebook_abi-${{ matrix.target }}.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          sha256sum libebook_abi-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            assets/libebook_abi-*.tar.gz assets/SHA256SUMS
